<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111111">
<title>Wedding Invitation</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }

  .gallery {
    position: relative;
    height: 100dvh;
    touch-action: pinch-zoom;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  .card {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(1.05);
    transition: opacity .8s ease, transform 1.2s ease;
    pointer-events: none;
  }
  .card.on { opacity: 1; transform: scale(1); }
  .card img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
  }

  .bars {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    left: calc(10px + env(safe-area-inset-left));
    right: calc(10px + env(safe-area-inset-right));
    display: flex;
    gap: 5px;
    pointer-events: none;
  }
  .bars span {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: rgba(255, 255, 255, .35);
    box-shadow: 0 0 2px rgba(0, 0, 0, .5);
    overflow: hidden;
  }
  .bars i {
    display: block;
    height: 100%;
    background: #fff;
    transform: scaleX(0);
    transform-origin: left;
  }

  .save {
    position: fixed;
    top: calc(24px + env(safe-area-inset-top));
    right: calc(12px + env(safe-area-inset-right));
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0, 0, 0, .45);
    display: grid;
    place-items: center;
  }
  .save svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: opacity .2s linear; transform: none; }
  }
</style>
</head>
<body>

<main class="gallery" id="gallery">
  <section class="card on" data-name="01-Mehndi.jpg"><img src="01-mehndi.jpg" alt="Mehndi invitation card" draggable="false"></section>
  <section class="card" data-name="02-Barat.jpg"><img src="02-barat.jpg" alt="Barat invitation card" draggable="false"></section>
  <section class="card" data-name="03-Waleema.jpg"><img src="03-waleema.jpg" alt="Waleema invitation card" draggable="false"></section>
</main>

<div class="bars" id="bars"><span><i></i></span><span><i></i></span><span><i></i></span></div>

<a class="save" id="save" href="01-mehndi.jpg" download="01-Mehndi.jpg" aria-label="Save this card"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></a>

<script>
  const SHOW_MS = 5000;   // how long each card stays up
  const TAP_MS = 250;     // shorter than this is a tap, longer is a hold
  const SWIPE_PX = 40;

  const gallery = document.getElementById('gallery');
  const cards = [...gallery.children];
  const fills = [...document.querySelectorAll('#bars i')];
  const save = document.getElementById('save');

  let index = 0;
  let elapsed = 0;
  let held = false;
  let last = performance.now();

  function go(i) {
    index = (i + cards.length) % cards.length;
    elapsed = 0;
    cards.forEach((c, n) => c.classList.toggle('on', n === index));
    const card = cards[index];
    save.href = card.querySelector('img').getAttribute('src');
    save.download = card.dataset.name;
  }

  function tick(now) {
    const dt = now - last;
    last = now;
    if (!held && !document.hidden) elapsed += Math.min(dt, 250);
    if (elapsed >= SHOW_MS) go(index + 1);
    fills.forEach((f, n) => {
      const p = n < index ? 1 : n === index ? elapsed / SHOW_MS : 0;
      f.style.transform = 'scaleX(' + p + ')';
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Press and hold pauses. A quick tap on the right goes forward, on the left goes back.
  // A swipe does the same.
  let startX = 0, startT = 0;
  gallery.addEventListener('pointerdown', e => {
    if (!e.isPrimary) return;
    held = true;
    startX = e.clientX;
    startT = performance.now();
    gallery.setPointerCapture(e.pointerId);
  });
  gallery.addEventListener('pointerup', e => {
    if (!e.isPrimary || !held) return;
    held = false;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > SWIPE_PX) go(index + (dx < 0 ? 1 : -1));
    else if (performance.now() - startT < TAP_MS) go(index + (e.clientX > innerWidth * 0.3 ? 1 : -1));
  });
  gallery.addEventListener('pointercancel', () => { held = false; });
  gallery.addEventListener('contextmenu', e => e.preventDefault());

  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(index + 1);
    if (e.key === 'ArrowLeft') go(index - 1);
  });
</script>
</body>
</html>
